<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Abacoa Podiatry">
  <rect width="64" height="64" rx="13" fill="#0c0b08"/>
  <g transform="translate(11.5 4.5) scale(0.5)">
  <!-- Striding-legs mark: an open walking stance — back leg sweeping left,
       forward leg driving down-right, both meeting at the hip. Recreated as
       vector; swap for the practice's original artwork when available. -->
  <g fill="none" stroke="#ffffff" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- back leg: hip -> knee -> ankle, sweeping left -->
    <path d="M60 8 C56 24 49 38 40 50 C33 60 28 71 25 82 C24 87 23 91 23 95"/>
    <!-- forward leg: hip -> knee -> ankle, driving down and right -->
    <path d="M60 8 C64 24 67 39 66 53 C65 66 61 78 55 88 C53 92 51 94 49 96"/>
    <!-- calf accent on the forward leg, as in the original mark -->
    <path d="M63 34 C66 45 66 57 63 68"/>
  </g>
  <g fill="#ffffff">
    <!-- back foot, toe pointing left -->
    <path d="M24.6 93.2 c-4.6 1.6 -8.6 3.8 -11.9 6.7 c-1.4 1.2 -1.9 2.3 -1.4 3.2 c0.5 0.9 1.7 1.2 3.6 0.9 l12.0 -2.0 l-1.0 -5.6 l-4.6 0.8 c1.2 -0.9 2.5 -1.7 3.9 -2.4 Z"/>
    <!-- forward foot, toe pointing right -->
    <path d="M48.0 93.6 c3.9 2.9 7.0 6.2 9.2 9.9 c0.9 1.5 1.0 2.7 0.3 3.4 c-0.7 0.7 -1.9 0.6 -3.6 -0.3 l-10.7 -5.6 l2.6 -5.1 l4.1 2.1 c-0.8 -1.3 -1.8 -2.5 -2.9 -3.7 Z"/>
  </g>
  </g>
</svg>
